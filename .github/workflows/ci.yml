name: CI

on:
  pull_request:
    branches: [main]
  # A post-merge run on main, so main itself carries a verdict and not only the
  # pull requests that fed it. Nothing below reads the pull_request payload.
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Fetch upstream (fork-surface derivation needs upstream refs)
        run: |
          git remote add upstream https://github.com/nanocoai/nanoclaw.git 2>/dev/null || true
          git fetch upstream --prune --quiet

      # The fork's patch surface is derived, not hand-listed. This fails if the
      # query and docs/fork-patches.json disagree in either direction — a patch
      # nobody dispositioned, or a "carried" patch whose content silently went
      # back to upstream's. The second case is how the v2.1.54 sync lost two
      # hardenings with a green suite.
      - name: Fork surface matches manifest
        run: pnpm run fork:check

      # fork:check proves pnpm-lock.yaml is DISPOSITIONED; it has no opinion
      # about the versions inside it. A sync that takes upstream's lockfile
      # wholesale gives back every dependency bump merged since the last sync,
      # and nothing else here would notice. See scripts/lockfile-regressions.mjs.
      - name: No dependency downgrades vs main
        run: |
          git fetch origin main --quiet
          node scripts/lockfile-regressions.mjs --base origin/main

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck host
        run: pnpm exec tsc --noEmit

      - name: Typecheck container
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit

      - name: Host tests
        run: pnpm exec vitest run

      - name: Container tests
        working-directory: container/agent-runner
        run: bun run test

  # Repository rules require exact `ci`; always run it so matrix failures remain blocking.
  ci:
    if: always()
    needs: test
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success

  # The single check the main ruleset will require, in every repo under the same
  # name. It needs `ci` as well as `test` so the older required context and the
  # new one cannot disagree. if: always() because a skipped required check is
  # not a failed one.
  gate:
    name: gate
    if: always()
    needs: [test, ci]
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every needed job succeeded
        run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.ci.result }}" = success

  fork-guard-liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/nanocoai/nanoclaw.git 2>/dev/null || true
          git fetch upstream --prune --quiet
      # Reverts each carried patch to upstream's copy and requires its guard to
      # go red. A guard that passes both ways reports safety it does not provide.
      - name: Fork guards are live
        run: pnpm run fork:liveness
